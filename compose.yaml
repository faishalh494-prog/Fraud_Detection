services:
  api:
    build: .
    command:
      - python
      - -m
      - uvicorn
      - backend.app:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    environment:
      SYNDICAI_API_KEY: ${SYNDICAI_API_KEY:?Set SYNDICAI_API_KEY in the environment}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data:ro
      - ./models:/app/models:rw
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import json,urllib.request; r=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health')); raise SystemExit(0 if r.get('status') == 'ready' and r.get('api_key_configured') else 1)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  dashboard:
    build: .
    command:
      - python
      - -m
      - streamlit
      - run
      - frontend/streamlit_app.py
      - --server.address
      - 0.0.0.0
      - --server.port
      - "8501"
    environment:
      SYNDICAI_API_URL: http://api:8000
      SYNDICAI_API_KEY: ${SYNDICAI_API_KEY:?Set SYNDICAI_API_KEY in the environment}
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped
